name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pip install -e .
      - run: pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e . onnx onnxscript onnxruntime

      - name: Export model to ONNX
        run: python scripts/export_onnx.py --output-dir web

      - name: Quantize model for the web
        run: python scripts/quantize_onnx.py --input web/model.onnx --output web/model.quant.onnx

      # The page loads the quantized artifact and only falls back to the
      # full fp32 graph on failure. Dropping it from the Pages artifact cuts
      # the upload from ~42MB to ~6MB, which is what makes the deployment
      # finish inside the action timeout instead of stalling in syncing_files.
      - name: Drop the full fp32 model from the Pages artifact
        run: rm web/model.onnx

      - name: Export probe head to JSON
        run: python scripts/export_probe.py --output web/probe.json

      - name: Fetch vendored onnxruntime assets
        run: python scripts/fetch_vendor.py --output-dir web/vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
