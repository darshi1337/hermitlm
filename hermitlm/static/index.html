<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HermitLM</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1416;
    --panel: #161d20;
    --border: #263136;
    --text: #e8eef0;
    --muted: #8fa3ab;
    --accent: #b65f36;
    --accent-text: #fff4ee;
    --bubble-user: #1f2a2e;
    --bubble-bot: #20302c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f1ea;
      --panel: #ffffff;
      --border: #e2ddd0;
      --text: #22201b;
      --muted: #6b6459;
      --accent: #b65f36;
      --accent-text: #fff4ee;
      --bubble-user: #ece7db;
      --bubble-bot: #e6efe9;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 720px;
    padding: 20px 16px 8px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  main {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0 16px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.pending { color: var(--muted); font-style: italic; }
  .bubble.error { background: #4a1f1f; border-color: #6b2b2b; color: #f3c7c7; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 0 20px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #empty {
    color: var(--muted);
    text-align: center;
    margin-top: 40px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    <h1>🦀 HermitLM</h1>
    <p>a tiny crab that lives in an 8M-parameter language model</p>
  </header>
  <main>
    <div id="log">
      <div id="empty">say hi to the crab.</div>
    </div>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="say something..." maxlength="500" />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

<script>
(() => {
  const log = document.getElementById("log");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let userId = localStorage.getItem("hermitlm_user_id");
  if (!userId) {
    userId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
    localStorage.setItem("hermitlm_user_id", userId);
  }

  function addBubble(role, text, opts = {}) {
    if (empty.parentNode) empty.remove();
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (opts.pending ? " pending" : "") + (opts.error ? " error" : "");
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function send(message) {
    addBubble("user", message);
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    const pending = addBubble("bot", "...", { pending: true });

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, message }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = typeof err.detail === "string" ? err.detail : "request failed";
        pending.textContent = detail;
        pending.classList.remove("pending");
        pending.classList.add("error");
      } else {
        const data = await res.json();
        pending.textContent = data.response;
        pending.classList.remove("pending");
      }
    } catch (e) {
      pending.textContent = "Could not reach HermitLM. Is the API running?";
      pending.classList.remove("pending");
      pending.classList.add("error");
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (message) send(message);
  });

  input.focus();
})();
</script>
</body>
</html>
