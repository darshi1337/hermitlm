[project]
name = "hermitlm"
version = "0.1.0"
description = "A compact conversational language model with an in-browser chat website"
authors = [{name="darshi1337"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "tokenizers>=0.14",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "ddgs>=6.0",
]

[project.scripts]
hermitlm = "hermitlm.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermitlm*"]

[tool.setuptools.package-data]
hermitlm = ["static/*.html"]
